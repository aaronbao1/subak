[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-backend"
version = "0.1.0"
description = "Backend for the Northstar AI-spend planning workspace (FastAPI + SQLite)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.seed" = ["corpus/*.md", "spend/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../agent"]
addopts = "-ra"
